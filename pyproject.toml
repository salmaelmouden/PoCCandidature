[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growth-intelligence-ai"
version = "0.1.0"
description = "AI-native growth analytics, decision support and automation (portfolio)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.36",
  "psycopg>=3.2.3",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "alembic>=1.14.0",
  "httpx>=0.28.0",
  # Floor set by the design system, not by the app logic: `st.navigation` with
  # grouped pages, `width="stretch"`, and the `[theme.light]` / `[theme.dark]`
  # config keys are all recent additions. This is the version the theme was
  # validated against; an older resolve would render an unstyled dashboard.
  "streamlit>=1.62.0",
  "pandas>=2.2.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "anthropic>=0.125.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]
observability = [
  "langfuse>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests", "app", "evaluation"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# The Streamlit entrypoint is referenced by name from the Makefile, the compose
# file and the Dockerfile, so its capitalised module name is a contract, not a
# style slip.
"dashboard/Home.py" = ["N999"]
