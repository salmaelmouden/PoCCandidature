services:
  postgres:
    image: postgres:16-alpine
    container_name: gia-postgres
    environment:
      POSTGRES_DB: growth_intelligence
      POSTGRES_USER: growth
      POSTGRES_PASSWORD: growth
    ports:
      - "5434:5432"
    volumes:
      - gia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth -d growth_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [gia]

  # App jobs/services reuse host WSL site-packages (mounted).
  # Container python binary is used (venv python is a host symlink to /usr/bin/python3).
  # Prerequisite: `make install` once on the host.
  migrate:
    image: python:3.12-slim
    container_name: gia-migrate
    working_dir: /app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &app_env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: growth_intelligence
      POSTGRES_USER: growth
      POSTGRES_PASSWORD: growth
      APP_ENV: development
      LOG_LEVEL: INFO
      PYTHONPATH: /app:/opt/venv/lib/python3.12/site-packages
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - ./:/app
      - ./.venv:/opt/venv:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [gia]

  seed:
    image: python:3.12-slim
    container_name: gia-seed
    working_dir: /app
    command: ["python", "scripts/seed_synthetic_data.py"]
    environment:
      <<: *app_env
      SYNTHETIC_SEED: "42"
      SYNTHETIC_DAYS: "90"
    volumes:
      - ./:/app
      - ./.venv:/opt/venv:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [gia]

  api:
    image: python:3.12-slim
    container_name: gia-api
    working_dir: /app
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      <<: *app_env
    volumes:
      - ./:/app
      - ./.venv:/opt/venv:ro
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [gia]

  dashboard:
    image: python:3.12-slim
    container_name: gia-dashboard
    working_dir: /app
    command:
      [
        "python",
        "-m",
        "streamlit",
        "run",
        "dashboard/Home.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
        "--server.headless",
        "true",
      ]
    environment:
      <<: *app_env
    volumes:
      - ./:/app
      - ./.venv:/opt/venv:ro
    ports:
      - "8501:8501"
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks: [gia]

  # Visual n8n editor — optional profile.
  # Prefer local build (make n8n-build) when Docker Hub is blocked by corporate TLS.
  n8n:
    profiles: ["n8n"]
    image: ${N8N_IMAGE:-gia-n8n:local}
    build:
      context: ./docker/n8n
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://fproxy.havre-port.lan:8080}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://fproxy.havre-port.lan:8080}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    container_name: gia-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - gia_n8n_data:/home/node/.n8n
      - ./n8n/workflows:/import:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [gia]
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  gia:

volumes:
  gia_pgdata:
  gia_n8n_data:
